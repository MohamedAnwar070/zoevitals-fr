<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="stethBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF0" />
      <stop offset="100%" stop-color="#E8F1F4" />
    </linearGradient>
    <linearGradient id="tubeBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4C7D9F" />
      <stop offset="100%" stop-color="#284A61" />
    </linearGradient>
    <linearGradient id="steelGleam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#D1DFE4" />
      <stop offset="100%" stop-color="#8FBBC7" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#1B303E" flood-opacity="0.14" />
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#stethBg)" />
  <ellipse cx="400" cy="520" rx="250" ry="24" fill="#1B303E" fill-opacity="0.08" />

  <g filter="url(#shadow)" transform="translate(160, 60)">
    <!-- Ear Tubes (Binaural Stainless Steel) -->
    <path d="M 170 50 C 170 120, 230 180, 240 210" fill="none" stroke="url(#steelGleam)" stroke-width="9" stroke-linecap="round" />
    <path d="M 310 50 C 310 120, 250 180, 240 210" fill="none" stroke="url(#steelGleam)" stroke-width="9" stroke-linecap="round" />
    <!-- Binaural tension spring -->
    <path d="M 185 130 C 240 160, 240 160, 295 130" fill="none" stroke="url(#steelGleam)" stroke-width="6" stroke-linecap="round" />

    <!-- Ear Tips (Soft sealing pale mint/white silicone) -->
    <ellipse cx="170" cy="50" rx="14" ry="10" fill="#C9EAE4" stroke="#4C7D9F" stroke-width="2" />
    <ellipse cx="310" cy="50" rx="14" ry="10" fill="#C9EAE4" stroke="#4C7D9F" stroke-width="2" />

    <!-- Y-Yoke Connector -->
    <circle cx="240" cy="215" r="12" fill="#284A61" />

    <!-- Medical Blue Flexible Acoustic Tubing Loop -->
    <path d="M 240 220 C 240 310, 100 290, 90 390 C 80 470, 240 480, 280 430 C 310 380, 310 320, 370 330 C 420 340, 420 410, 380 440 L 330 450" 
          fill="none" stroke="url(#tubeBlue)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Dual-head Stainless Steel Chestpiece Assembly -->
    <!-- Stem -->
    <rect x="290" y="440" width="45" height="18" rx="4" transform="rotate(-15 310 450)" fill="url(#steelGleam)" stroke="#355C75" stroke-width="2" />

    <!-- Adult Diaphragm and Pediatric Bell -->
    <g transform="translate(240, 410) rotate(-15)">
      <!-- Outer Rim (Non-chill ring) -->
      <circle cx="50" cy="50" r="54" fill="#C9EAE4" stroke="#4C7D9F" stroke-width="2.5" />
      <!-- Stainless steel body disc -->
      <circle cx="50" cy="50" r="48" fill="url(#steelGleam)" stroke="#284A61" stroke-width="2" />
      <!-- Tunable diaphragm surface with laser engraving -->
      <circle cx="50" cy="50" r="40" fill="#FFFFFF" stroke="#8FBBC7" stroke-width="1.5" />
      <!-- Subtle concentric acoustic rings -->
      <circle cx="50" cy="50" r="32" fill="none" stroke="#D5E5E8" stroke-width="1" />
      <circle cx="50" cy="50" r="22" fill="none" stroke="#D5E5E8" stroke-width="1" />
      <circle cx="50" cy="50" r="10" fill="none" stroke="#D5E5E8" stroke-width="1" />

      <!-- Centered Zoe Vitals subtle insignia -->
      <text x="50" y="53" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" font-weight="800" fill="#4C7D9F" text-anchor="middle" letter-spacing="1">ZOE</text>
    </g>
  </g>

  <!-- Technical Spec Callout -->
  <g transform="translate(560, 110)">
    <rect width="190" height="74" rx="8" fill="#FFFFFF" stroke="#8FBBC7" stroke-width="1" filter="url(#shadow)" />
    <text x="16" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#13222B">ACOUSTIC DYNAMICS</text>
    <text x="16" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="500" fill="#4C7D9F">Dual Tunable Diaphragm</text>
    <text x="16" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="500" fill="#6B8A99">Machined 316L Stainless Steel</text>
  </g>
</svg>
