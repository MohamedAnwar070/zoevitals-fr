<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF0" />
      <stop offset="100%" stop-color="#EDF5F7" />
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2EDF0" />
    </linearGradient>
    <linearGradient id="blueAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4C7D9F" />
      <stop offset="100%" stop-color="#345B75" />
    </linearGradient>
    <linearGradient id="mintGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C9EAE4" />
      <stop offset="100%" stop-color="#A8DCD4" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#1B303E" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)" />

  <!-- Subtle Studio Grid -->
  <line x1="100" y1="520" x2="700" y2="520" stroke="#8FBBC7" stroke-width="1.5" stroke-opacity="0.3" />
  <ellipse cx="400" cy="510" rx="220" ry="24" fill="#1B303E" fill-opacity="0.08" />

  <!-- Thermometer Device Body (Ergonomic handheld clinical thermometer) -->
  <g filter="url(#shadow)" transform="translate(180, 80)">
    <!-- Sensor head -->
    <path d="M 120 70 C 120 40, 160 30, 220 30 C 270 30, 300 50, 310 90 L 310 130 C 290 140, 240 145, 180 140 Z" fill="url(#bodyGrad)" stroke="#8FBBC7" stroke-width="2" />
    <!-- Sensor probe tip -->
    <path d="M 115 65 L 75 75 C 65 78, 60 88, 62 98 L 65 110 C 68 118, 76 123, 85 120 L 125 105 Z" fill="#345B75" />
    <ellipse cx="68" cy="95" rx="8" ry="16" fill="#13222B" />
    <circle cx="68" cy="95" r="4" fill="#D00000" opacity="0.8" />

    <!-- Main Handle & Shell -->
    <path d="M 310 90 C 330 110, 360 160, 350 240 C 342 300, 320 380, 310 420 C 300 450, 260 460, 230 455 C 200 450, 195 420, 205 380 C 220 320, 230 260, 210 200 C 195 160, 160 150, 150 140 Z" fill="url(#bodyGrad)" stroke="#8FBBC7" stroke-width="2" />
    
    <!-- Grip inset with medical blue tone -->
    <path d="M 215 220 C 228 260, 225 310, 215 360 C 225 365, 245 365, 255 355 C 265 310, 270 260, 250 215 Z" fill="url(#blueAccent)" opacity="0.9" />

    <!-- Trigger button -->
    <path d="M 175 190 C 160 205, 160 225, 178 235 L 195 225 L 195 195 Z" fill="#345B75" />

    <!-- Display Screen Bezel -->
    <rect x="250" y="110" width="80" height="90" rx="14" fill="#13222B" stroke="#4C7D9F" stroke-width="2" />
    <!-- Backlit Screen -->
    <rect x="255" y="115" width="70" height="80" rx="8" fill="url(#mintGlow)" />
    
    <!-- Temperature Reading -->
    <text x="290" y="152" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="22" font-weight="800" fill="#0D4843" text-anchor="middle">36.8</text>
    <text x="316" y="136" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="700" fill="#0D4843">°C</text>
    <text x="290" y="172" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" font-weight="600" fill="#1B554E" text-anchor="middle">BODY MODE</text>
    <circle cx="270" cy="182" r="3" fill="#4C7D9F" />
    <text x="280" y="185" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="8" font-weight="600" fill="#1B554E">CALIBRATED</text>

    <!-- Function Buttons -->
    <circle cx="265" cy="225" r="7" fill="#E2EDF0" stroke="#8FBBC7" stroke-width="1.5" />
    <text x="265" y="228" font-family="sans-serif" font-size="8" font-weight="700" fill="#4C7D9F" text-anchor="middle">M</text>
    <circle cx="285" cy="225" r="7" fill="#E2EDF0" stroke="#8FBBC7" stroke-width="1.5" />
    <text x="285" y="228" font-family="sans-serif" font-size="8" font-weight="700" fill="#4C7D9F" text-anchor="middle">C</text>
    <circle cx="305" cy="225" r="7" fill="#E2EDF0" stroke="#8FBBC7" stroke-width="1.5" />
    <text x="305" y="228" font-family="sans-serif" font-size="8" font-weight="700" fill="#4C7D9F" text-anchor="middle">🔊</text>

    <!-- Branding stamp placeholder -->
    <text x="260" y="260" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="8" font-weight="700" fill="#4C7D9F" letter-spacing="1">ZOE VITALS</text>
    <text x="260" y="272" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="7" font-weight="500" fill="#7C9DA6">INFRA-SCAN 310</text>
  </g>

  <!-- Technical Spec Callout Badge -->
  <g transform="translate(560, 120)">
    <rect width="180" height="74" rx="8" fill="#FFFFFF" stroke="#8FBBC7" stroke-width="1" filter="url(#shadow)" />
    <text x="16" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#13222B">CLINICAL SPECIFICATION</text>
    <text x="16" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="500" fill="#4C7D9F">Response: &lt; 1.0 second</text>
    <text x="16" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="500" fill="#6B8A99">Accuracy: ±0.2°C clinical</text>
  </g>
</svg>
