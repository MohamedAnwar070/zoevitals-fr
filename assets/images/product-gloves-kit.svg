<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="kitBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF0" />
      <stop offset="100%" stop-color="#EBF4F5" />
    </linearGradient>
    <linearGradient id="gloveBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4C7D9F" />
      <stop offset="100%" stop-color="#2D536D" />
    </linearGradient>
    <linearGradient id="pouchSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#D7E6EA" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#1B303E" flood-opacity="0.12" />
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#kitBg)" />
  <ellipse cx="400" cy="510" rx="260" ry="24" fill="#1B303E" fill-opacity="0.08" />

  <g filter="url(#shadow)" transform="translate(130, 90)">
    <!-- Dispenser Box for Nitrile Gloves -->
    <rect x="50" y="160" width="280" height="200" rx="14" fill="#FFFFFF" stroke="#8FBBC7" stroke-width="2" />
    <!-- Box top header banner -->
    <path d="M 50 174 C 50 166, 56 160, 64 160 L 316 160 C 324 160, 330 166, 330 174 L 330 215 L 50 215 Z" fill="#4C7D9F" />
    <text x="75" y="196" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800" fill="#FFFDF0" letter-spacing="1">ZOE VITALS</text>
    <text x="210" y="195" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#C9EAE4">CLINICAL GLOVES</text>
    
    <!-- Oval dispenser opening with gloves peeking out -->
    <ellipse cx="190" cy="275" rx="75" ry="32" fill="#EBF4F6" stroke="#8FBBC7" stroke-width="2" />
    <!-- Nitrile glove material draped out -->
    <path d="M 130 280 C 135 250, 245 250, 250 280 C 235 315, 145 315, 130 280 Z" fill="url(#gloveBlue)" opacity="0.95" />
    <path d="M 160 270 C 180 260, 200 260, 220 270" fill="none" stroke="#6898B7" stroke-width="3" stroke-linecap="round" />

    <!-- Box specs text -->
    <text x="75" y="335" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#13222B">POWDER-FREE NITRILE</text>
    <text x="75" y="348" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="500" fill="#6B8A99">Non-Sterile • Micro-Textured • 100 ct</text>

    <!-- Sterile Dressing Kit Peel-Pouch Beside It -->
    <g transform="translate(260, 40)">
      <rect x="50" y="80" width="220" height="310" rx="10" fill="url(#pouchSilver)" stroke="#8FBBC7" stroke-width="2" />
      <rect x="65" y="95" width="190" height="280" rx="6" fill="#FFFFFF" fill-opacity="0.9" stroke="#E2ECEF" stroke-width="1.5" />
      <!-- Chevron peel tab -->
      <path d="M 130 80 L 160 110 L 190 80 Z" fill="#C9EAE4" stroke="#8FBBC7" stroke-width="1.5" />
      <text x="160" y="100" font-family="sans-serif" font-size="8" font-weight="700" fill="#0D4843" text-anchor="middle">PEEL</text>

      <!-- Sterile indicator bar -->
      <rect x="80" y="125" width="160" height="18" rx="4" fill="#EBF4F6" />
      <circle cx="95" cy="134" r="5" fill="#D00000" />
      <text x="108" y="137" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#13222B">STERILE EO</text>

      <!-- Contents silhouette (gauze, tweezers, cotton balls) -->
      <rect x="85" y="160" width="70" height="70" rx="4" fill="#F4F8F7" stroke="#8FBBC7" stroke-dasharray="3 3" />
      <text x="120" y="200" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#4C7D9F" text-anchor="middle">GAUZE PAD</text>
      
      <!-- Forceps graphic -->
      <path d="M 185 160 L 175 220 M 190 160 L 180 220" stroke="#4C7D9F" stroke-width="3" stroke-linecap="round" />
      
      <!-- Drape graphic -->
      <rect x="85" y="250" width="150" height="90" rx="6" fill="#C9EAE4" fill-opacity="0.4" stroke="#8FBBC7" stroke-width="1.5" />
      <text x="160" y="300" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#355C75" text-anchor="middle">BARRIER FIELD DRAPE</text>
    </g>
  </g>

  <!-- Technical Spec Callout -->
  <g transform="translate(560, 100)">
    <rect width="190" height="74" rx="8" fill="#FFFFFF" stroke="#8FBBC7" stroke-width="1" filter="url(#shadow)" />
    <text x="16" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#13222B">CONSUMABLE STANDARD</text>
    <text x="16" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="500" fill="#4C7D9F">AQL 1.5 Clinical Standard</text>
    <text x="16" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="500" fill="#6B8A99">Latex-Free • Accelerator-Free</text>
  </g>
</svg>
