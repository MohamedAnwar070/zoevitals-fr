<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="o2Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF0" />
      <stop offset="100%" stop-color="#EBF4F6" />
    </linearGradient>
    <linearGradient id="chromeBody" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#F2F6F7" />
      <stop offset="30%" stop-color="#D5E3E7" />
      <stop offset="70%" stop-color="#FAFCFD" />
      <stop offset="100%" stop-color="#9CBEC8" />
    </linearGradient>
    <linearGradient id="brassBrass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EED59D" />
      <stop offset="100%" stop-color="#BA9A56" />
    </linearGradient>
    <linearGradient id="gaugeDial" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F0F4F6" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#1B303E" flood-opacity="0.14" />
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#o2Bg)" />
  <ellipse cx="400" cy="520" rx="200" ry="22" fill="#1B303E" fill-opacity="0.09" />

  <g filter="url(#shadow)" transform="translate(180, 70)">
    <!-- Main Cylinder Stem Fitting (Inlet) -->
    <rect x="50" y="300" width="90" height="40" rx="6" fill="url(#brassBrass)" stroke="#8C6E2D" stroke-width="2" />
    <circle cx="70" cy="320" r="14" fill="#3D2E11" />
    <!-- Bullnose nut -->
    <rect x="110" y="290" width="40" height="60" rx="4" fill="url(#chromeBody)" stroke="#8FBBC7" stroke-width="2" />
    
    <!-- Central Regulator Valve Chamber -->
    <rect x="150" y="270" width="130" height="100" rx="16" fill="url(#chromeBody)" stroke="#8FBBC7" stroke-width="2.5" />
    
    <!-- Pressure Relief Valve & Adjustment Knob -->
    <path d="M 215 370 L 215 440" stroke="#4C7D9F" stroke-width="22" stroke-linecap="round" />
    <rect x="185" y="440" width="60" height="35" rx="8" fill="#4C7D9F" stroke="#355C75" stroke-width="2" />
    <!-- Grip ridges on adjustment knob -->
    <line x1="195" y1="440" x2="195" y2="475" stroke="#FFFDF0" stroke-width="2" />
    <line x1="205" y1="440" x2="205" y2="475" stroke="#FFFDF0" stroke-width="2" />
    <line x1="215" y1="440" x2="215" y2="475" stroke="#FFFDF0" stroke-width="2" />
    <line x1="225" y1="440" x2="225" y2="475" stroke="#FFFDF0" stroke-width="2" />
    <line x1="235" y1="440" x2="235" y2="475" stroke="#FFFDF0" stroke-width="2" />

    <!-- Left: Cylinder Pressure Gauge -->
    <rect x="190" y="190" width="50" height="80" fill="url(#chromeBody)" stroke="#8FBBC7" stroke-width="2" />
    <circle cx="215" cy="150" r="75" fill="url(#chromeBody)" stroke="#8FBBC7" stroke-width="4" />
    <circle cx="215" cy="150" r="68" fill="url(#gaugeDial)" stroke="#13222B" stroke-width="1.5" />
    <!-- Dial marks -->
    <circle cx="215" cy="150" r="60" fill="none" stroke="#DCE7EA" stroke-width="8" stroke-dasharray="2 6" />
    <!-- Alert Red Danger Zone (Overpressure) -->
    <path d="M 255 105 A 60 60 0 0 1 270 145" fill="none" stroke="#D00000" stroke-width="6" />
    <!-- Normal Range Green/Mint -->
    <path d="M 170 185 A 60 60 0 0 1 250 105" fill="none" stroke="#4C7D9F" stroke-width="6" />
    <!-- Dial Label -->
    <text x="215" y="135" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#13222B" text-anchor="middle">OXYGEN</text>
    <text x="215" y="147" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" font-weight="600" fill="#6B8A99" text-anchor="middle">PSI × 100 / BAR</text>
    <!-- Pointer Needle -->
    <line x1="215" y1="150" x2="238" y2="108" stroke="#13222B" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="215" cy="150" r="6" fill="#355C75" />

    <!-- Right: Flowmeter Tube Assembly -->
    <rect x="280" y="295" width="40" height="30" fill="url(#chromeBody)" stroke="#8FBBC7" stroke-width="2" />
    <!-- Vertical glass rotameter tube -->
    <rect x="320" y="110" width="55" height="230" rx="10" fill="#FFFFFF" fill-opacity="0.85" stroke="#8FBBC7" stroke-width="2.5" />
    <line x1="330" y1="130" x2="365" y2="130" stroke="#4C7D9F" stroke-width="1.5" />
    <text x="368" y="133" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#355C75" font-weight="600">15</text>
    <line x1="335" y1="160" x2="365" y2="160" stroke="#4C7D9F" stroke-width="1.5" />
    <text x="368" y="163" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#355C75" font-weight="600">10</text>
    <line x1="335" y1="190" x2="365" y2="190" stroke="#4C7D9F" stroke-width="1.5" />
    <text x="368" y="193" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#355C75" font-weight="600">5</text>
    <line x1="338" y1="220" x2="365" y2="220" stroke="#4C7D9F" stroke-width="1.5" />
    <text x="368" y="223" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#355C75" font-weight="600">2</text>
    <line x1="338" y1="250" x2="365" y2="250" stroke="#4C7D9F" stroke-width="1.5" />
    <text x="368" y="253" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#355C75" font-weight="600">1</text>
    <text x="348" y="290" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#6B8A99" font-weight="700" text-anchor="middle">LPM</text>

    <!-- Float ball (indicated at 5 LPM) -->
    <circle cx="347" cy="190" r="7" fill="#13222B" stroke="#4C7D9F" stroke-width="1.5" />

    <!-- Humidifier Bottle Outlet Port -->
    <rect x="330" y="340" width="35" height="30" fill="url(#chromeBody)" stroke="#8FBBC7" stroke-width="2" />
    <path d="M 335 370 L 335 410 C 335 415, 360 415, 360 410 L 360 370 Z" fill="url(#brassBrass)" stroke="#8C6E2D" stroke-width="1.5" />
    <line x1="333" y1="385" x2="362" y2="385" stroke="#3D2E11" stroke-width="1.5" />
    <line x1="333" y1="395" x2="362" y2="395" stroke="#3D2E11" stroke-width="1.5" />
  </g>

  <!-- Technical Spec Callout -->
  <g transform="translate(560, 130)">
    <rect width="190" height="74" rx="8" fill="#FFFFFF" stroke="#8FBBC7" stroke-width="1" filter="url(#shadow)" />
    <text x="16" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#13222B">FLOW SPECIFICATION</text>
    <text x="16" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="500" fill="#4C7D9F">Range: 0 – 15 LPM calibrated</text>
    <text x="16" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="500" fill="#6B8A99">Inlet: 200 Bar / Bullnose Pin</text>
  </g>
</svg>
