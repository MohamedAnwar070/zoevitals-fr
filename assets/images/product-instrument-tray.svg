<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="trayBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF0" />
      <stop offset="100%" stop-color="#EDF4F6" />
    </linearGradient>
    <linearGradient id="steelSurface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#DEE7EA" />
      <stop offset="60%" stop-color="#F2F7F8" />
      <stop offset="100%" stop-color="#AEC6CE" />
    </linearGradient>
    <linearGradient id="toolSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EAF1F3" />
      <stop offset="100%" stop-color="#7B9EAA" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#1B303E" flood-opacity="0.14" />
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#trayBg)" />
  <ellipse cx="400" cy="510" rx="260" ry="24" fill="#1B303E" fill-opacity="0.08" />

  <g filter="url(#shadow)" transform="translate(130, 90)">
    <!-- Main Heavy-Gauge Instrument Tray Base -->
    <rect x="50" y="80" width="440" height="310" rx="16" fill="url(#steelSurface)" stroke="#8FBBC7" stroke-width="2.5" />
    <!-- Deep drawn inner compartment -->
    <rect x="70" y="100" width="400" height="270" rx="12" fill="#EBF2F4" stroke="#8FBBC7" stroke-width="1.5" />
    <!-- Seamless corner radii & coved edges -->
    <rect x="80" y="110" width="380" height="250" rx="8" fill="#F4F8F9" />

    <!-- Silicone Instrument Hold-Down Mat (Perforated pale mint) -->
    <rect x="90" y="120" width="360" height="230" rx="6" fill="#C9EAE4" fill-opacity="0.5" stroke="#8FBBC7" stroke-width="1" />
    <!-- Perforation matrix -->
    <g fill="#8FBBC7" opacity="0.6">
      <circle cx="110" cy="140" r="3" /><circle cx="130" cy="140" r="3" /><circle cx="150" cy="140" r="3" />
      <circle cx="110" cy="160" r="3" /><circle cx="130" cy="160" r="3" /><circle cx="150" cy="160" r="3" />
      <circle cx="110" cy="180" r="3" /><circle cx="130" cy="180" r="3" /><circle cx="150" cy="180" r="3" />
      <circle cx="110" cy="200" r="3" /><circle cx="130" cy="200" r="3" /><circle cx="150" cy="200" r="3" />
      <circle cx="110" cy="220" r="3" /><circle cx="130" cy="220" r="3" /><circle cx="150" cy="220" r="3" />
      <circle cx="110" cy="240" r="3" /><circle cx="130" cy="240" r="3" /><circle cx="150" cy="240" r="3" />
      <circle cx="110" cy="260" r="3" /><circle cx="130" cy="260" r="3" /><circle cx="150" cy="260" r="3" />
      <circle cx="110" cy="280" r="3" /><circle cx="130" cy="280" r="3" /><circle cx="150" cy="280" r="3" />
      <circle cx="110" cy="300" r="3" /><circle cx="130" cy="300" r="3" /><circle cx="150" cy="300" r="3" />
      <circle cx="110" cy="320" r="3" /><circle cx="130" cy="320" r="3" /><circle cx="150" cy="320" r="3" />
    </g>

    <!-- Instruments arranged neatly inside tray -->
    <!-- Scalpel Handle No. 3 -->
    <path d="M 210 140 L 220 135 L 220 320 L 210 325 Z" fill="url(#toolSteel)" stroke="#4C7D9F" stroke-width="1.5" />
    <path d="M 220 135 L 223 150 L 220 170 Z" fill="#8FBBC7" />
    <!-- Metric graduation lines on handle -->
    <line x1="212" y1="220" x2="218" y2="220" stroke="#FFFDF0" stroke-width="1" />
    <line x1="212" y1="235" x2="218" y2="235" stroke="#FFFDF0" stroke-width="1" />
    <line x1="212" y1="250" x2="218" y2="250" stroke="#FFFDF0" stroke-width="1" />

    <!-- Hemostatic Forceps / Clamps -->
    <g transform="translate(260, 130)">
      <!-- Ring handles -->
      <circle cx="20" cy="180" r="14" fill="none" stroke="url(#toolSteel)" stroke-width="4" />
      <circle cx="50" cy="180" r="14" fill="none" stroke="url(#toolSteel)" stroke-width="4" />
      <!-- Ratchet lock -->
      <line x1="28" y1="165" x2="42" y2="165" stroke="#355C75" stroke-width="3" />
      <!-- Shanks & box lock pivot -->
      <line x1="20" y1="166" x2="35" y2="90" stroke="url(#toolSteel)" stroke-width="5" stroke-linecap="round" />
      <line x1="50" y1="166" x2="35" y2="90" stroke="url(#toolSteel)" stroke-width="5" stroke-linecap="round" />
      <circle cx="35" cy="90" r="6" fill="#355C75" />
      <!-- Serrated jaws -->
      <path d="M 35 90 L 30 20 M 35 90 L 40 20" stroke="url(#toolSteel)" stroke-width="4" stroke-linecap="round" />
    </g>

    <!-- Dissecting Tissue Forceps (Tweezers) -->
    <g transform="translate(360, 140)">
      <path d="M 20 20 C 25 15, 35 15, 40 20 L 32 170 C 31 175, 29 175, 28 170 Z" fill="url(#toolSteel)" stroke="#4C7D9F" stroke-width="1.5" />
      <!-- Serrations -->
      <line x1="25" y1="60" x2="35" y2="60" stroke="#8FBBC7" stroke-width="1.5" />
      <line x1="25" y1="70" x2="35" y2="70" stroke="#8FBBC7" stroke-width="1.5" />
      <line x1="25" y1="80" x2="35" y2="80" stroke="#8FBBC7" stroke-width="1.5" />
      <line x1="25" y1="90" x2="35" y2="90" stroke="#8FBBC7" stroke-width="1.5" />
    </g>

    <!-- Autoclave indicator tape strip -->
    <rect x="420" y="80" width="50" height="18" fill="#FFFDF0" stroke="#8FBBC7" stroke-width="1" />
    <line x1="425" y1="80" x2="435" y2="98" stroke="#13222B" stroke-width="2" />
    <line x1="440" y1="80" x2="450" y2="98" stroke="#13222B" stroke-width="2" />
    <line x1="455" y1="80" x2="465" y2="98" stroke="#13222B" stroke-width="2" />
  </g>

  <!-- Technical Spec Callout -->
  <g transform="translate(560, 110)">
    <rect width="190" height="74" rx="8" fill="#FFFFFF" stroke="#8FBBC7" stroke-width="1" filter="url(#shadow)" />
    <text x="16" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#13222B">STERILISATION COMPATIBILITY</text>
    <text x="16" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="500" fill="#4C7D9F">Steam Autoclave: Up to 134°C</text>
    <text x="16" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="500" fill="#6B8A99">316 Surgical Grade Stainless</text>
  </g>
</svg>
