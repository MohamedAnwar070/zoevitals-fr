<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="nebBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF0" />
      <stop offset="100%" stop-color="#E8F4F5" />
    </linearGradient>
    <linearGradient id="plasticWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#DCE7EA" />
    </linearGradient>
    <linearGradient id="medBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4C7D9F" />
      <stop offset="100%" stop-color="#355C75" />
    </linearGradient>
    <linearGradient id="transLiquid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C9EAE4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#8FBBC7" stop-opacity="0.4" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="20" stdDeviation="20" flood-color="#1B303E" flood-opacity="0.12" />
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#nebBg)" />
  <ellipse cx="400" cy="520" rx="180" ry="20" fill="#1B303E" fill-opacity="0.08" />

  <g filter="url(#dropShadow)" transform="translate(260, 90)">
    <!-- Main Handheld Body -->
    <rect x="70" y="180" width="140" height="260" rx="40" fill="url(#plasticWhite)" stroke="#8FBBC7" stroke-width="2" />
    
    <!-- Blue ergonomic side grips -->
    <path d="M 70 240 C 60 280, 60 320, 70 360" fill="none" stroke="#4C7D9F" stroke-width="6" stroke-linecap="round" />
    <path d="M 210 240 C 220 280, 220 320, 210 360" fill="none" stroke="#4C7D9F" stroke-width="6" stroke-linecap="round" />

    <!-- Power button -->
    <circle cx="140" cy="300" r="22" fill="#FFFFFF" stroke="#8FBBC7" stroke-width="2" />
    <circle cx="140" cy="300" r="16" fill="url(#medBlue)" />
    <!-- Power Icon -->
    <path d="M 140 292 L 140 300 M 134 295 A 8 8 0 1 0 146 295" fill="none" stroke="#FFFDF0" stroke-width="2.5" stroke-linecap="round" />

    <!-- Battery / Status LED indicator -->
    <circle cx="140" cy="340" r="4" fill="#C9EAE4" stroke="#4C7D9F" stroke-width="1.5" />

    <!-- Transparent Medication Cup Upper Assembly -->
    <rect x="85" y="80" width="110" height="110" rx="20" fill="url(#transLiquid)" stroke="#8FBBC7" stroke-width="2" />
    <!-- Measurement graduation lines -->
    <line x1="95" y1="110" x2="115" y2="110" stroke="#4C7D9F" stroke-width="1.5" />
    <text x="122" y="113" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#355C75" font-weight="600">8ml</text>
    <line x1="95" y1="130" x2="110" y2="130" stroke="#4C7D9F" stroke-width="1.5" />
    <text x="117" y="133" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#355C75" font-weight="600">4ml</text>
    <line x1="95" y1="150" x2="105" y2="150" stroke="#4C7D9F" stroke-width="1.5" />
    <text x="112" y="153" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#355C75" font-weight="600">2ml</text>

    <!-- Mesh Disk Aperture -->
    <circle cx="140" cy="135" r="18" fill="#E2EDF0" stroke="#4C7D9F" stroke-width="2" />
    <circle cx="140" cy="135" r="12" fill="#355C75" />
    <!-- Micro mesh dots -->
    <circle cx="138" cy="133" r="1" fill="#C9EAE4" />
    <circle cx="142" cy="133" r="1" fill="#C9EAE4" />
    <circle cx="140" cy="137" r="1" fill="#C9EAE4" />

    <!-- Clinical Mouthpiece / Mask Adaptor -->
    <path d="M 120 80 L 120 30 C 120 20, 160 20, 160 30 L 160 80 Z" fill="url(#plasticWhite)" stroke="#8FBBC7" stroke-width="2" />
    <!-- Subtle mist effect -->
    <ellipse cx="140" cy="10" rx="35" ry="12" fill="#C9EAE4" fill-opacity="0.4" />
    <ellipse cx="140" cy="-5" rx="50" ry="18" fill="#C9EAE4" fill-opacity="0.2" />

    <!-- Branding -->
    <text x="140" y="390" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#4C7D9F" text-anchor="middle" letter-spacing="1">ZOE VITALS</text>
    <text x="140" y="405" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="500" fill="#8FBBC7" text-anchor="middle">AEROMESH 150</text>
  </g>

  <!-- Technical Spec Callout -->
  <g transform="translate(520, 140)">
    <rect width="200" height="74" rx="8" fill="#FFFFFF" stroke="#8FBBC7" stroke-width="1" filter="url(#dropShadow)" />
    <text x="16" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#13222B">AEROSOL PERFORMANCE</text>
    <text x="16" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="500" fill="#4C7D9F">MMAD: ≤ 3.5 μm</text>
    <text x="16" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="500" fill="#6B8A99">Noise Level: &lt; 25 dBA quiet</text>
  </g>
</svg>
